name: MediTurno CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Validar backend y frontend
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: secreto-exclusivo-para-integracion-continua

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: src/backend
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        working-directory: src/backend
        run: npm test

      - name: Validar archivos principales del frontend
        run: |
          test -s src/frontend/index.html
          test -s src/frontend/login.html
          test -s src/frontend/register.html
          test -s src/frontend/appointments.html
          test -s src/frontend/appointments.js
          test -s src/frontend/appointments.css
          test -s src/frontend/styles.css
          echo "Archivos principales del frontend verificados correctamente"

  docker:
    name: Validar imagen Docker
    runs-on: ubuntu-latest
    needs: validate

    env:
      JWT_SECRET: secreto-exclusivo-para-docker-ci

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t mediturno-app:${{ github.sha }} .

      - name: Ejecutar contenedor de prueba
        run: |
          docker rm -f mediturno-ci >/dev/null 2>&1 || true
          docker run --name mediturno-ci -d -p 5000:5000 -e JWT_SECRET="$JWT_SECRET" mediturno-app:${{ github.sha }}

      - name: Esperar health check
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs mediturno-ci
          exit 1

      - name: Verificar frontend
        run: |
          curl -fsS http://localhost:5000/ -o /tmp/mediturno-home.html
          grep -qi "<html" /tmp/mediturno-home.html

      - name: Mostrar logs si falla
        if: failure()
        run: docker logs mediturno-ci || true

      - name: Eliminar contenedor de prueba
        if: always()
        run: docker rm -f mediturno-ci >/dev/null 2>&1 || true

  deploy:
    name: Desplegar en VPS de GCP
    runs-on: ubuntu-latest
    needs:
      - validate
      - docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Ejecutar comandos de despliegue en VPS por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            # Clonar o actualizar el repositorio en el VPS
            if [ ! -d "$HOME/mediturno-app/.git" ]; then
              git clone https://github.com/JohanU89-coder/mediturno-app.git "$HOME/mediturno-app"
            fi
            
            cd "$HOME/mediturno-app"
            git fetch --all
            git checkout main
            git reset --hard origin/main
            
            # Construir la imagen Docker localmente en el VPS
            docker build -t mediturno-app:latest .
            
            # Detener y remover el contenedor anterior si existe
            docker rm -f mediturno-app-prod || true
            
            # Iniciar el nuevo contenedor con la última versión
            docker run -d \
              --name mediturno-app-prod \
              -p 5000:5000 \
              -e JWT_SECRET="${{ secrets.PRODUCTION_JWT_SECRET }}" \
              -e PORT="5000" \
              -e NODE_ENV="production" \
              --restart unless-stopped \
              mediturno-app:latest
