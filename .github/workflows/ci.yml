name: MediTurno CI/CD

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate:
    name: Validar backend y frontend
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: secreto-exclusivo-para-integracion-continua

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: src/backend
        run: npm ci

      - name: Ejecutar pruebas automatizadas
        working-directory: src/backend
        run: npm test

      - name: Validar archivos principales del frontend
        run: |
          test -s src/frontend/index.html
          test -s src/frontend/login.html
          test -s src/frontend/register.html
          test -s src/frontend/appointments.html
          test -s src/frontend/appointments.js
          test -s src/frontend/appointments.css
          test -s src/frontend/styles.css
          echo "Archivos principales del frontend verificados correctamente"

  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}

    steps:
      - name: Disparar Deploy Hook de Render
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test opcional
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL no configurado; se omite smoke test."
            exit 0
          fi

          HEALTH_URL="${RENDER_SERVICE_URL%/}/api/health"
          curl -fsS --retry 12 --retry-delay 10 --retry-connrefused "$HEALTH_URL"
