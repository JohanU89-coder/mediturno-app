services:
  - type: web
    name: mediturno
    runtime: node
    plan: free
    branch: main
    buildCommand: "cd src/backend && npm ci && npm test && rm -rf public && mkdir -p public && cp -R ../frontend/* public && npm prune --omit=dev"
    startCommand: "cd src/backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
